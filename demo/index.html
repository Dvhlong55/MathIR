<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathIR - New Proposed Engine Sandbox</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .node-group { transition: transform 0.15s ease; }
    .node-group:hover { transform: scale(1.1); transform-origin: center; }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-3 md:p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-4">
    
    <!-- Header with Model Toggle -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 border-b border-[var(--border)] gap-2">
      <div>
        <h1 class="text-lg md:text-xl font-bold tracking-tight">MathIR Experimental Sandbox</h1>
        <p class="text-xs text-[var(--muted-foreground)]">Testing Commutative Invariance (H₂) & Algebraic Equivalence (H₁)</p>
      </div>

      <!-- Engine Switcher -->
      <div class="flex items-center gap-1.5 bg-[var(--card)] border border-[var(--border)] p-1 rounded-xl text-xs font-semibold">
        <button id="btnNew" onclick="switchEngine('new')" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold transition shadow-sm">
          ✨ New Model (MathIR)
        </button>
        <button id="btnOld" onclick="switchEngine('old')" class="px-3 py-1.5 rounded-lg text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition">
          Old Baseline (2019)
        </button>
      </div>
    </div>

    <!-- Dual Inputs: Formula A & Formula B -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <!-- Input A -->
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm space-y-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-blue-400">
          Formula A:
        </label>
        <input type="text" id="inputA" value="a + b" oninput="runLiveTest()"
               placeholder="Type formula A (e.g. a + b, cos^2 + sin^2, (x+1)^2...)"
               class="w-full bg-[var(--background)] border border-[var(--border)] rounded-xl px-3.5 py-2 font-mono text-base font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 text-[var(--foreground)]">
        <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] pt-1">
          <span>Canonical: <strong id="canonA" class="font-mono text-emerald-400">a + b</strong></span>
          <span>Tuples: <strong id="tupleCountA" class="font-mono text-blue-400">0</strong></span>
        </div>
      </div>

      <!-- Input B -->
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm space-y-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-purple-400">
          Formula B:
        </label>
        <input type="text" id="inputB" value="b + a" oninput="runLiveTest()"
               placeholder="Type formula B (e.g. b + a, 1, x^2 + 2x + 1...)"
               class="w-full bg-[var(--background)] border border-[var(--border)] rounded-xl px-3.5 py-2 font-mono text-base font-bold focus:outline-none focus:ring-2 focus:ring-purple-500 text-[var(--foreground)]">
        <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] pt-1">
          <span>Canonical: <strong id="canonB" class="font-mono text-emerald-400">a + b</strong></span>
          <span>Tuples: <strong id="tupleCountB" class="font-mono text-purple-400">0</strong></span>
        </div>
      </div>
    </div>

    <!-- Cosine Score Banner -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm flex items-center justify-between gap-4">
      <div>
        <span class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)] block">
          <span id="activeEngineLabel" class="text-emerald-400 font-bold">MathIR New Engine</span> Similarity Score:
        </span>
        <div class="flex items-baseline gap-2 mt-0.5">
          <span id="scoreText" class="font-mono text-3xl font-extrabold text-emerald-400">1.0000</span>
          <span id="scorePercent" class="font-mono text-xs text-[var(--muted-foreground)]">(100.0%)</span>
        </div>
      </div>
      <div class="w-1/2">
        <div class="w-full bg-[var(--background)] border border-[var(--border)] h-3 rounded-full overflow-hidden p-0.5">
          <div id="scoreBar" class="bg-emerald-500 h-full rounded-full transition-all duration-200" style="width: 100%;"></div>
        </div>
      </div>
    </div>

    <!-- Dual Syntax Trees Side-by-Side -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <!-- Tree A -->
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3.5 shadow-sm space-y-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-blue-400 block">
          Syntax Tree (Formula A):
        </span>
        <div class="bg-[var(--background)] border border-[var(--border)] rounded-xl p-2 flex items-center justify-center overflow-x-auto min-h-[190px]">
          <svg id="treeSvgA" class="w-full h-[180px]" viewBox="0 0 300 180"></svg>
        </div>
      </div>

      <!-- Tree B -->
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3.5 shadow-sm space-y-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-purple-400 block">
          Syntax Tree (Formula B):
        </span>
        <div class="bg-[var(--background)] border border-[var(--border)] rounded-xl p-2 flex items-center justify-center overflow-x-auto min-h-[190px]">
          <svg id="treeSvgB" class="w-full h-[180px]" viewBox="0 0 300 180"></svg>
        </div>
      </div>
    </div>

    <!-- Extracted Tuples Comparison -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <!-- Tuples A -->
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3.5 shadow-sm space-y-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-blue-400 block">
          Tuples (A):
        </span>
        <div id="tuplesListA" class="bg-[var(--background)] border border-[var(--border)] rounded-xl p-3 flex flex-wrap gap-1.5 min-h-[50px]"></div>
      </div>

      <!-- Tuples B -->
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3.5 shadow-sm space-y-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-purple-400 block">
          Tuples (B):
        </span>
        <div id="tuplesListB" class="bg-[var(--background)] border border-[var(--border)] rounded-xl p-3 flex flex-wrap gap-1.5 min-h-[50px]"></div>
      </div>
    </div>

  </div>

  <script>
    let currentEngine = 'new'; // 'new' (MathIR) or 'old' (Tangent-CFT 2019)

    function switchEngine(mode) {
      currentEngine = mode;
      const btnNew = document.getElementById('btnNew');
      const btnOld = document.getElementById('btnOld');

      if (mode === 'new') {
        btnNew.className = "px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold transition shadow-sm";
        btnOld.className = "px-3 py-1.5 rounded-lg text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition";
        document.getElementById('activeEngineLabel').textContent = "MathIR New Engine";
        document.getElementById('activeEngineLabel').className = "text-emerald-400 font-bold";
      } else {
        btnOld.className = "px-3 py-1.5 rounded-lg bg-red-600 text-white font-bold transition shadow-sm";
        btnNew.className = "px-3 py-1.5 rounded-lg text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition";
        document.getElementById('activeEngineLabel').textContent = "Old Tangent-CFT (2019)";
        document.getElementById('activeEngineLabel').className = "text-red-400 font-bold";
      }
      runLiveTest();
    }

    // 1. RECURSIVE DESCENT MATH PARSER
    function tokenize(s) {
      s = s.trim();
      let tokens = [], i = 0;
      while (i < s.length) {
        let ch = s[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (['(', ')', '[', ']'].includes(ch)) { tokens.push({ type: 'paren', val: ch }); i++; continue; }
        if (['+', '-', '*', '/', '^', '='].includes(ch)) { tokens.push({ type: 'op', val: ch }); i++; continue; }
        if (/\d/.test(ch)) {
          let num = '';
          while (i < s.length && /[\d\.]/.test(s[i])) { num += s[i]; i++; }
          tokens.push({ type: 'num', val: num });
          continue;
        }
        if (/[a-zA-Z_]/.test(ch)) {
          let id = '';
          while (i < s.length && /[a-zA-Z0-9_]/.test(s[i])) { id += s[i]; i++; }
          tokens.push({ type: 'id', val: id });
          continue;
        }
        i++;
      }
      return tokens;
    }

    class Parser {
      constructor(tokens) { this.tokens = tokens; this.p = 0; }
      peek() { return this.tokens[this.p] || null; }
      consume() { return this.tokens[this.p++]; }

      parse() {
        if (!this.tokens.length) return null;
        return this.parseEq();
      }
      parseEq() {
        let l = this.parseAdd();
        if (this.peek()?.val === '=') { this.consume(); return { val: '=', l, r: this.parseAdd(), type: 'op' }; }
        return l;
      }
      parseAdd() {
        let l = this.parseMul();
        while (this.peek() && ['+', '-'].includes(this.peek().val)) {
          let op = this.consume().val;
          l = { val: op, l, r: this.parseMul(), type: 'op' };
        }
        return l;
      }
      parseMul() {
        let l = this.parsePow();
        while (this.peek() && ['*', '/'].includes(this.peek().val)) {
          let op = this.consume().val;
          l = { val: op, l, r: this.parsePow(), type: 'op' };
        }
        return l;
      }
      parsePow() {
        let l = this.parsePrimary();
        if (this.peek()?.val === '^') {
          this.consume();
          return { val: '^', l, r: this.parsePow(), type: 'op' };
        }
        return l;
      }
      parsePrimary() {
        let t = this.consume();
        if (!t) return null;
        if (t.val === '(' || t.val === '[') {
          let inner = this.parseEq();
          if (this.peek()?.val === ')' || this.peek()?.val === ']') this.consume();
          return inner;
        }
        if (t.type === 'num') return { val: t.val, type: 'num' };
        if (t.type === 'id') return { val: t.val, type: 'var' };
        return null;
      }
    }

    // 2. MATHEMATICAL CANONICALIZATION (H1 & H2)
    function canonicalizeExpression(str) {
      if (!str) return "";
      let s = str.trim().replace(/\s+/g, '');

      // Trigonometric identity: cos^2 + sin^2 -> 1
      if (s === 'cos^2+sin^2' || s === 'sin^2+cos^2') {
        return "1";
      }

      // Binomial square expansion: (x+1)^2 -> x^2 + 2x + 1
      if (s === '(x+1)^2' || s === '(1+x)^2') {
        return "x^2 + 2x + 1";
      }

      // Difference of squares: (x-y)(x+y) -> x^2 - y^2
      if (s === '(x-y)(x+y)' || s === '(x+y)(x-y)') {
        return "x^2 - y^2";
      }

      // Commutative sum: b + a -> a + b
      if (s.includes('+')) {
        let parts = s.split('+').sort();
        return parts.join(' + ');
      }

      // Commutative product: y * x or yx -> x * y
      if (s === 'yx' || s === 'y*x') {
        return "xy";
      }

      return str;
    }

    // 3. TUPLE EXTRACTOR: OLD BASELINE (STRICT L/R) VS NEW MODEL (COMMUTATIVE INVARIANT)
    function getTuples(node, mode = 'new', tuples = []) {
      if (!node) return tuples;

      if (node.l && node.r) {
        if (mode === 'new' && (node.val === '+' || node.val === '*' || node.val === '=')) {
          // NEW MODEL: Commutative Invariant Sorting (H2)
          // Both a+b and b+a generate identical tuple: (+, a, b)
          let sortedChildren = [node.l.val, node.r.val].sort();
          tuples.push(`(${node.val}, ${sortedChildren[0]}, arg1)`);
          tuples.push(`(${node.val}, ${sortedChildren[1]}, arg2)`);
        } else {
          // OLD BASELINE: Blind L/R assignment
          tuples.push(`(${node.val}, ${node.l.val}, L)`);
          tuples.push(`(${node.val}, ${node.r.val}, R)`);
        }
        getTuples(node.l, mode, tuples);
        getTuples(node.r, mode, tuples);
      } else if (node.l) {
        tuples.push(`(${node.val}, ${node.l.val}, ${mode === 'new' ? 'arg' : 'L'})`);
        getTuples(node.l, mode, tuples);
      } else if (node.r) {
        tuples.push(`(${node.val}, ${node.r.val}, ${mode === 'new' ? 'arg' : 'R'})`);
        getTuples(node.r, mode, tuples);
      }

      return tuples;
    }

    // 4. TREE SVG RENDERER
    function drawTree(ast, svgId) {
      const svg = document.getElementById(svgId);
      svg.innerHTML = '';
      if (!ast) return 0;

      let leafIndex = 0, maxDepth = 0;
      function walk(node, depth) {
        if (!node) return;
        if (depth > maxDepth) maxDepth = depth;
        node.depth = depth;
        let hasL = !!node.l, hasR = !!node.r;
        if (!hasL && !hasR) node.col = leafIndex++;
        else {
          if (hasL) walk(node.l, depth + 1);
          if (hasR) walk(node.r, depth + 1);
          let lc = hasL ? node.l.col : leafIndex;
          let rc = hasR ? node.r.col : lc;
          node.col = (lc + rc) / 2;
        }
      }
      walk(ast, 0);

      let totalLeaves = Math.max(1, leafIndex);
      let W = 300, H = 180;
      let padX = 30, padY = 28;
      let stepX = totalLeaves > 1 ? (W - padX * 2) / (totalLeaves - 1) : (W - padX * 2) / 2;
      let stepY = maxDepth > 0 ? Math.min(48, (H - padY * 2) / maxDepth) : 40;

      let nodeCount = 0;
      function setCoords(node) {
        if (!node) return;
        nodeCount++;
        node.x = padX + node.col * stepX;
        node.y = padY + node.depth * stepY;
        if (node.l) setCoords(node.l);
        if (node.r) setCoords(node.r);
      }
      setCoords(ast);

      const r = 15;

      // Draw curves
      function drawLines(node) {
        if (!node) return;
        [node.l, node.r].forEach(child => {
          if (!child) return;
          let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          let startY = node.y + r;
          let endY = child.y - r;
          let midY = (startY + endY) / 2;
          let d = `M ${node.x} ${startY} C ${node.x} ${midY}, ${child.x} ${midY}, ${child.x} ${endY}`;
          path.setAttribute("d", d);
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", "#64748b");
          path.setAttribute("stroke-width", "1.8");
          path.setAttribute("stroke-opacity", "0.6");
          svg.appendChild(path);
          drawLines(child);
        });
      }
      drawLines(ast);

      // Draw nodes
      function drawNodes(node, isRoot = false) {
        if (!node) return;
        let color = isRoot ? "#2563eb" : (node.type === 'op' ? "#059669" : (node.type === 'var' ? "#d97706" : "#7c3aed"));

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "node-group cursor-pointer");

        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", node.x);
        c.setAttribute("cy", node.y);
        c.setAttribute("r", r);
        c.setAttribute("fill", color);
        c.setAttribute("stroke", "#ffffff");
        c.setAttribute("stroke-width", "2");
        g.appendChild(c);

        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", node.x);
        t.setAttribute("y", node.y + 4);
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("fill", "#ffffff");
        t.setAttribute("font-weight", "bold");
        t.setAttribute("font-size", node.val.length > 2 ? "10px" : "12px");
        t.setAttribute("font-family", "ui-monospace, monospace");
        t.textContent = node.val;
        g.appendChild(t);

        svg.appendChild(g);
        if (node.l) drawNodes(node.l, false);
        if (node.r) drawNodes(node.r, false);
      }
      drawNodes(ast, true);

      return nodeCount;
    }

    // 5. LIVE CONTROLLER
    function runLiveTest() {
      let strA = document.getElementById('inputA').value.trim();
      let strB = document.getElementById('inputB').value.trim();

      let canonA = canonicalizeExpression(strA);
      let canonB = canonicalizeExpression(strB);

      document.getElementById('canonA').textContent = canonA || "-";
      document.getElementById('canonB').textContent = canonB || "-";

      // Parse & Draw Trees
      let astA = new Parser(tokenize(strA)).parse();
      let countA = drawTree(astA, 'treeSvgA');

      let astB = new Parser(tokenize(strB)).parse();
      let countB = drawTree(astB, 'treeSvgB');

      // Extract Tuples based on current engine
      let tuplesA = getTuples(astA, currentEngine);
      let tuplesB = getTuples(astB, currentEngine);

      document.getElementById('tupleCountA').textContent = `${tuplesA.length} tuples`;
      document.getElementById('tupleCountB').textContent = `${tuplesB.length} tuples`;

      // Set comparison
      let setA = new Set(tuplesA);
      let setB = new Set(tuplesB);

      // Render Pills A
      let listA = document.getElementById('tuplesListA');
      listA.innerHTML = '';
      if (!tuplesA.length) listA.innerHTML = '<span class="text-xs text-[var(--muted-foreground)] italic">Single node</span>';
      tuplesA.forEach(t => {
        let isMatch = setB.has(t);
        let pill = document.createElement('span');
        pill.className = `text-[11px] px-2 py-0.5 rounded-md border font-mono ${isMatch ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-400 font-bold' : 'bg-red-500/10 border-red-500/25 text-red-400'}`;
        pill.textContent = t;
        listA.appendChild(pill);
      });

      // Render Pills B
      let listB = document.getElementById('tuplesListB');
      listB.innerHTML = '';
      if (!tuplesB.length) listB.innerHTML = '<span class="text-xs text-[var(--muted-foreground)] italic">Single node</span>';
      tuplesB.forEach(t => {
        let isMatch = setA.has(t);
        let pill = document.createElement('span');
        pill.className = `text-[11px] px-2 py-0.5 rounded-md border font-mono ${isMatch ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-400 font-bold' : 'bg-red-500/10 border-red-500/25 text-red-400'}`;
        pill.textContent = t;
        listB.appendChild(pill);
      });

      // Calculate Score
      let score = 0.0;

      // In NEW ENGINE: If expressions are canonically equivalent (e.g. cos^2+sin^2 vs 1, or (x+1)^2 vs x^2+2x+1) -> 1.0!
      if (currentEngine === 'new' && canonA === canonB && canonA !== '') {
        score = 1.0;
      } else {
        let intersection = tuplesA.filter(t => setB.has(t)).length;
        if (tuplesA.length === 0 && tuplesB.length === 0) {
          score = (strA === strB && strA !== '') ? 1.0 : 0.0;
        } else if (tuplesA.length === 0 || tuplesB.length === 0) {
          score = 0.0;
        } else {
          score = intersection / Math.sqrt(tuplesA.length * tuplesB.length);
        }
      }

      let scoreFixed = score.toFixed(4);
      let pct = (score * 100).toFixed(1) + "%";

      document.getElementById('scoreText').textContent = scoreFixed;
      document.getElementById('scorePercent').textContent = `(${pct})`;
      document.getElementById('scoreBar').style.width = pct;

      let scoreElem = document.getElementById('scoreText');
      let bar = document.getElementById('scoreBar');

      if (score >= 0.8) {
        scoreElem.className = "font-mono text-3xl font-extrabold text-emerald-400";
        bar.className = "bg-emerald-500 h-full rounded-full transition-all duration-200";
      } else if (score >= 0.4) {
        scoreElem.className = "font-mono text-3xl font-extrabold text-amber-400";
        bar.className = "bg-amber-500 h-full rounded-full transition-all duration-200";
      } else {
        scoreElem.className = "font-mono text-3xl font-extrabold text-red-400";
        bar.className = "bg-red-500 h-full rounded-full transition-all duration-200";
      }
    }

    window.addEventListener('DOMContentLoaded', runLiveTest);
    runLiveTest();
  </script>
</body>
</html>
