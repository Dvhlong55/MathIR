<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathIR</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen p-4 sm:p-8 flex justify-center items-start font-sans antialiased">

  <div class="w-full max-w-2xl space-y-4">

    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
      <div class="flex items-center gap-2">
        <h1 class="text-base font-bold text-white tracking-tight">MathIR Engine</h1>
        <span class="text-[11px] px-2 py-0.5 rounded bg-zinc-900 text-zinc-400 border border-zinc-800 font-mono">Hybrid</span>
      </div>
      <div class="flex items-center gap-2 text-xs font-mono text-zinc-400">
        <span class="w-1.5 h-1.5 rounded-full bg-zinc-400"></span>
        <span id="backendStatus">Ready</span>
      </div>
    </div>

    <!-- Presets -->
    <div class="flex flex-wrap gap-1.5 text-xs">
      <button onclick="loadPreset('a*b - b*a', '0')"
        class="px-2.5 py-1 rounded-md bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition font-mono">
        ab - ba
      </button>
      <button onclick="loadPreset('cos(x)^2 + sin(x)^2', '1')"
        class="px-2.5 py-1 rounded-md bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition font-mono">
        cos² + sin²
      </button>
      <button onclick="loadPreset('a^3 + b^3 + c^3 - 3*a*b*c', '(a+b+c)*(a^2+b^2+c^2-a*b-b*c-c*a)')"
        class="px-2.5 py-1 rounded-md bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition font-mono">
        a³+b³+c³
      </button>
      <button onclick="loadPreset('sqrt(x^2)', 'x')"
        class="px-2.5 py-1 rounded-md bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-200 transition font-mono">
        √(x²) vs x
      </button>
      <button onclick="loadPreset('1 + 2 + ... + n', 'n*(n+1)/2')"
        class="px-2.5 py-1 rounded-md bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-200 transition font-mono">
        1+2+...+n
      </button>
      <button onclick="loadPreset('sum(i, (i, 1, n))', 'sum(k, (k, 1, m))')"
        class="px-2.5 py-1 rounded-md bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-200 transition font-mono">
        ∑i vs ∑k
      </button>
    </div>

    <!-- Inputs -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <div class="text-[11px] font-mono text-zinc-500 mb-1">Formula A</div>
        <input type="text" id="inputA" value="a*b - b*a" oninput="triggerEvaluation()"
          class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-white font-mono text-sm focus:outline-none focus:border-zinc-600 transition">
      </div>
      <div>
        <div class="text-[11px] font-mono text-zinc-500 mb-1">Formula B</div>
        <input type="text" id="inputB" value="0" oninput="triggerEvaluation()"
          class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-white font-mono text-sm focus:outline-none focus:border-zinc-600 transition">
      </div>
    </div>

    <!-- Results Card -->
    <div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-4 space-y-4">
      
      <!-- Main Score -->
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800/80">
        <div class="flex items-baseline gap-3">
          <span id="scoreText" class="font-mono text-3xl font-black text-white">100%</span>
          <span id="matchType" class="text-xs px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 font-mono">Identity</span>
        </div>
        <div class="w-32 bg-zinc-950 h-2 rounded-full overflow-hidden border border-zinc-800">
          <div id="scoreBar" class="bg-zinc-200 h-full rounded-full transition-all duration-200" style="width: 100%;"></div>
        </div>
      </div>

      <!-- 3 Channels -->
      <div class="grid grid-cols-3 gap-2 text-xs font-mono">
        <div class="bg-zinc-950 border border-zinc-800/80 rounded-lg p-2.5">
          <div class="text-zinc-500 text-[10px]">CAS</div>
          <div id="casDiffText" class="font-bold text-zinc-200 truncate mt-0.5">Δ = 0</div>
        </div>
        <div class="bg-zinc-950 border border-zinc-800/80 rounded-lg p-2.5">
          <div class="text-zinc-500 text-[10px]">Neural</div>
          <div id="neuralSimText" class="font-bold text-zinc-200 truncate mt-0.5">85.4%</div>
        </div>
        <div class="bg-zinc-950 border border-zinc-800/80 rounded-lg p-2.5">
          <div class="text-zinc-500 text-[10px]">AST</div>
          <div id="astOverlapText" class="font-bold text-zinc-200 truncate mt-0.5">0.0%</div>
        </div>
      </div>

      <!-- Bottleneck Alert -->
      <div id="bottleneckBanner" class="hidden rounded-lg p-3 text-xs space-y-1 bg-zinc-950 border border-zinc-700">
        <div class="font-bold text-zinc-200" id="bottleneckTitle"></div>
        <div class="text-zinc-400 leading-normal" id="bottleneckDesc"></div>
        <div class="text-zinc-400 text-[11px] pt-1 border-t border-zinc-800">
          <span class="text-zinc-200 font-medium">Khắc phục:</span>
          <span id="bottleneckRec"></span>
        </div>
      </div>

    </div>

    <!-- AST Collapsible -->
    <details class="text-xs text-zinc-500 cursor-pointer">
      <summary class="hover:text-zinc-300 select-none py-1">AST & Tuples</summary>
      <div class="mt-2 space-y-3 pt-3 border-t border-zinc-800">
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-2">
            <div class="text-[10px] text-zinc-500 mb-1">Tree A</div>
            <svg id="treeSvgA" class="w-full h-[150px]" viewBox="0 0 320 180"></svg>
          </div>
          <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-2">
            <div class="text-[10px] text-zinc-500 mb-1">Tree B</div>
            <svg id="treeSvgB" class="w-full h-[150px]" viewBox="0 0 320 180"></svg>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div id="tuplesListA" class="bg-zinc-950 border border-zinc-800 rounded-lg p-2 flex flex-wrap gap-1 max-h-[90px] overflow-y-auto"></div>
          <div id="tuplesListB" class="bg-zinc-950 border border-zinc-800 rounded-lg p-2 flex flex-wrap gap-1 max-h-[90px] overflow-y-auto"></div>
        </div>
      </div>
    </details>

  </div>

  <script>
    const BACKEND_URL = 'http://127.0.0.1:8000/api/evaluate';
    let debounceTimer = null;

    function loadPreset(formulaA, formulaB) {
      document.getElementById('inputA').value = formulaA;
      document.getElementById('inputB').value = formulaB;
      triggerEvaluation();
    }

    function triggerEvaluation() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(callPythonBackend, 150);
    }

    async function callPythonBackend() {
      const formulaA = document.getElementById('inputA').value.trim();
      const formulaB = document.getElementById('inputB').value.trim();

      try {
        const resp = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ formulaA, formulaB })
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        renderResults(data);
      } catch (err) {
        document.getElementById('backendStatus').textContent = "Offline";
      }
    }

    function renderResults(res) {
      document.getElementById('backendStatus').textContent = "Ready";

      const fused = res.fused_score;
      const pct = (fused * 100).toFixed(1) + "%";
      document.getElementById('scoreText').textContent = pct;
      document.getElementById('scoreBar').style.width = pct;
      
      let shortMatch = res.match_type;
      if (shortMatch.includes("Đồng Nhất") || shortMatch.includes("Identity")) shortMatch = "Identity (CAS)";
      else if (shortMatch.includes("Cao") || shortMatch.includes("High")) shortMatch = "High (Neural)";
      else if (shortMatch.includes("Trung Bình") || shortMatch.includes("Moderate")) shortMatch = "Moderate (Neural)";
      else if (shortMatch.includes("Bế Tắc Cú Pháp")) shortMatch = "Syntax Crash";
      else if (shortMatch.includes("Bế Tắc")) shortMatch = "Bottleneck";
      else shortMatch = "Low";
      document.getElementById('matchType').textContent = shortMatch;

      // CAS
      if (res.is_symbolic_equivalent) {
        document.getElementById('casDiffText').textContent = "Δ = 0";
      } else if (res.diff && res.diff.includes("Parse Error")) {
        document.getElementById('casDiffText').textContent = "Syntax Error";
      } else {
        document.getElementById('casDiffText').textContent = "Δ = " + res.diff;
      }

      // Neural & AST
      document.getElementById('neuralSimText').textContent = (res.neural_similarity * 100).toFixed(1) + "%";
      document.getElementById('astOverlapText').textContent = (res.ast_overlap_score * 100).toFixed(1) + "%";

      // Bottleneck Banner
      const banner = document.getElementById('bottleneckBanner');
      if (res.bottleneck_info) {
        banner.classList.remove('hidden');
        document.getElementById('bottleneckTitle').textContent = res.bottleneck_info.title;
        document.getElementById('bottleneckDesc').textContent = res.bottleneck_info.description;
        document.getElementById('bottleneckRec').textContent = res.bottleneck_info.recommendation;
      } else {
        banner.classList.add('hidden');
      }

      // Trees
      drawTree(res.treeA, 'treeSvgA');
      drawTree(res.treeB, 'treeSvgB');

      const commonSet = new Set(res.common_tuples || []);
      const listA = document.getElementById('tuplesListA');
      listA.innerHTML = '';
      (res.tuplesA || []).forEach(t => {
        const span = document.createElement('span');
        span.className = `px-1.5 py-0.5 rounded font-mono text-[9px] ${commonSet.has(t) ? 'bg-zinc-700 text-white font-bold' : 'bg-zinc-900 text-zinc-500'}`;
        span.textContent = t;
        listA.appendChild(span);
      });

      const listB = document.getElementById('tuplesListB');
      listB.innerHTML = '';
      (res.tuplesB || []).forEach(t => {
        const span = document.createElement('span');
        span.className = `px-1.5 py-0.5 rounded font-mono text-[9px] ${commonSet.has(t) ? 'bg-zinc-700 text-white font-bold' : 'bg-zinc-900 text-zinc-500'}`;
        span.textContent = t;
        listB.appendChild(span);
      });
    }

    function drawTree(ast, svgId) {
      const svg = document.getElementById(svgId);
      svg.innerHTML = '';
      if (!ast) return;

      let leafIndex = 0, maxDepth = 0;
      function walk(node, depth) {
        if (!node) return;
        if (depth > maxDepth) maxDepth = depth;
        node.depth = depth;
        let hasL = !!node.l, hasR = !!node.r;
        if (!hasL && !hasR) node.col = leafIndex++;
        else {
          if (hasL) walk(node.l, depth + 1);
          if (hasR) walk(node.r, depth + 1);
          let lc = hasL ? node.l.col : leafIndex;
          let rc = hasR ? node.r.col : lc;
          node.col = (lc + rc) / 2;
        }
      }
      walk(ast, 0);

      let totalLeaves = Math.max(1, leafIndex);
      let W = 320, H = 180;
      let padX = 24, padY = 24;
      let stepX = totalLeaves > 1 ? (W - padX * 2) / (totalLeaves - 1) : (W - padX * 2) / 2;
      let stepY = maxDepth > 0 ? Math.min(36, (H - padY * 2) / maxDepth) : 34;

      function setCoords(node) {
        if (!node) return;
        node.x = padX + node.col * stepX;
        node.y = padY + node.depth * stepY;
        if (node.l) setCoords(node.l);
        if (node.r) setCoords(node.r);
      }
      setCoords(ast);

      const r = 12;

      function drawLines(node) {
        if (!node) return;
        [node.l, node.r].forEach(child => {
          if (!child) return;
          let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", node.x);
          line.setAttribute("y1", node.y);
          line.setAttribute("x2", child.x);
          line.setAttribute("y2", child.y);
          line.setAttribute("stroke", "#52525b");
          line.setAttribute("stroke-width", "1.5");
          svg.appendChild(line);
          drawLines(child);
        });
      }
      drawLines(ast);

      function drawNodes(node) {
        if (!node) return;
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", node.x);
        c.setAttribute("cy", node.y);
        c.setAttribute("r", r);
        c.setAttribute("fill", "#18181b");
        c.setAttribute("stroke", "#71717a");
        c.setAttribute("stroke-width", "1.5");
        svg.appendChild(c);

        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", node.x);
        t.setAttribute("y", node.y + 3.5);
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("fill", "#fafafa");
        t.setAttribute("font-size", "10px");
        t.setAttribute("font-family", "monospace");
        t.textContent = node.val;
        svg.appendChild(t);

        if (node.l) drawNodes(node.l);
        if (node.r) drawNodes(node.r);
      }
      drawNodes(ast);
    }

    window.addEventListener('DOMContentLoaded', triggerEvaluation);
  </script>
</body>
</html>
